name: 临时样例与构建检查

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: 临时样例与构建检查
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: 获取代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: 执行检查
        run: |
          bash tests/test_unquarantine.sh
          bash tests/test_applescript_source.sh
          bash tests/test_build.sh
